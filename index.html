    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1000px);
      margin: 0 auto;
    }

    /* WHAT THIS DOES: Gives the page title a clear, prominent heading style. */
    h1 {
      margin: 0 0 32px;
      text-align: center;
      font-size: clamp(2rem, 5vw, 2.8rem);
      letter-spacing: -0.04em;
    }

    /* WHAT THIS DOES: Separates each teaching part into a simple white panel. */
    section {
      margin: 0 0 24px;
      padding: 28px;
      border: 1px solid #e3d7e8;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 10px 28px #42265012;
    }

    h2 {
      margin: 0 0 22px;
      font-size: 1.45rem;
    }

    /* WHAT THIS DOES: Keeps labels, text boxes, and buttons spaced and easy to scan. */
    .field {
      margin-bottom: 18px;
    }

    label.field-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 650;
    }

    textarea {
      display: block;
      box-sizing: border-box;
      width: 100%;
      min-height: 154px;
      padding: 12px 14px;
      resize: vertical;
      border: 1px solid #d7c6df;
      border-radius: 10px;
      background: #fdfafe;
      color: inherit;
      font: inherit;
      line-height: 1.55;
    }

    textarea:focus {
      outline: 3px solid #e6d1ef;
      border-color: #87539a;
    }

    .encode-box {
      min-height: 76px;
    }

    /* WHAT THIS DOES: Styles the controls so they look ready to use, without adding behavior. */
    button {
      padding: 11px 17px;
      border: 0;
      border-radius: 9px;
      background: #75438a;
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, background-color 140ms ease;
    }

    /* WHAT THIS DOES: Gently lifts a button on hover and presses it down on click. */
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #633777;
      box-shadow: 0 5px 12px #42265024;
    }

    button:active:not(:disabled) {
      transform: translateY(1px) scale(0.98);
      box-shadow: none;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    @media (prefers-reduced-motion: reduce) {
      button {
        transition: none;
      }
    }

    .radio-options {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 4px 0 20px;
    }

    .radio-options label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: default;
    }

    input[type="radio"] {
      accent-color: #75438a;
    }

    /* WHAT THIS DOES: Displays token chips and their matching IDs in the tokenizer results. */
    .token-results {
      margin-top: 22px;
    }

    .token-note {
      margin: 0 0 14px;
      color: #65536b;
    }

    .token-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      margin: 0 0 16px;
      color: #4f3d59;
    }

    .token-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .token-chip {
      min-width: 56px;
      padding: 8px 10px;
      border: 1px solid var(--chip-border);
      border-radius: 10px;
      background: var(--chip-color);
      text-align: center;
    }

    .token-word {
      display: block;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .token-id {
      display: block;
      margin-top: 3px;
      color: #65536b;
      font-size: 0.78rem;
    }

    /* WHAT THIS DOES: Makes the vocabulary results table scroll when it gets long. */
    .vocabulary-results {
      margin-top: 22px;
    }

    .vocabulary-size {
      margin: 0 0 10px;
      font-weight: 650;
    }

    /* WHAT THIS DOES: Makes the vocabulary slider easy to read and drag. */
    .vocabulary-slider {
      margin: 0 0 16px;
    }

    .vocabulary-slider label {
      display: block;
      margin-bottom: 8px;
      font-weight: 650;
    }

    .vocabulary-slider input {
      display: block;
      width: 100%;
      accent-color: #75438a;
    }

    .table-scroll {
      max-height: 280px;
      overflow: auto;
      border: 1px solid #e3d7e8;
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 9px 12px;
      border-bottom: 1px solid #ece3ef;
    }

    th {
      position: sticky;
      top: 0;
      background: #f1e8f5;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    /* WHAT THIS DOES: Places simple view controls above the larger chart area. */
    .chart-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .chart-controls button {
      padding: 8px 12px;
      font-size: 0.92rem;
    }

    .chart-controls button:disabled {
      opacity: 0.5;
    }

    .chart-hint {
      color: #65536b;
      font-size: 0.9rem;
    }

    /* WHAT THIS DOES: Styles the closest-pairs table shown below the chart. */
    .closest-pairs {
      margin-top: 18px;
    }

    .closest-pairs h3 {
      margin: 0 0 10px;
    }

    /* WHAT THIS DOES: Spaces the learner's extra sentence controls below the closest-pairs table. */
    .try-your-own {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #ece3ef;
    }

    .own-vector {
      margin: 14px 0;
      padding: 12px;
      overflow-wrap: anywhere;
      border-radius: 9px;
      background: #f1e8f5;
      color: #4f3d59;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
    }

    /* WHAT THIS DOES: Reserves a blank area where the future 3D chart will appear. */
    .chart-area {
      box-sizing: border-box;
      height: 740px;
      margin-top: 20px;
      border: 1px dashed #d7c6df;
      border-radius: 12px;
      background: #fdfafe;
    }

    /* WHAT THIS DOES: Reduces panel padding on narrow screens so the layout still fits. */
    @media (max-width: 600px) {
      body {
        padding: 24px 14px 40px;
      }

      section {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <!-- // WHAT THIS DOES: Holds the centered page title and the two teaching parts. -->
  <main class="page">
    <h1>LLM Pipeline Explorer</h1>

    <!-- // WHAT THIS DOES: Shows the tokenizer controls and their example sentences. -->
    <section aria-labelledby="tokenizer-title">
      <h2 id="tokenizer-title">Part 1: Tokenizer</h2>
      <div class="field">
        <label class="field-label" for="training-sentences">Training sentences</label>
        <textarea id="training-sentences" spellcheck="false">The cat sat on the mat.
A dog ran in the park.
Birds fly across the blue sky.
We like to read books.
The sun is warm today.
Small fish swim in clear water.</textarea>
      </div>
      <div class="field">
        <label class="field-label" for="encode-sentence">Encode a sentence</label>
        <textarea class="encode-box" id="encode-sentence" spellcheck="false">The curious cat sat on the mat.</textarea>
      </div>
      <button id="build-vocabulary" type="button">Build vocabulary</button>
      <button id="tokenize" type="button">Tokenize</button>
      <div id="vocabulary-controls" class="vocabulary-slider" hidden></div>
      <div id="vocabulary-results" class="vocabulary-results" aria-live="polite"></div>
      <div id="token-results" class="token-results" aria-live="polite"></div>
    </section>

    <!-- // WHAT THIS DOES: Shows example sentences, embedding choices, and an empty chart space. -->
    <section aria-labelledby="embeddings-title">
      <h2 id="embeddings-title">Part 2: Embeddings in 3D</h2>
      <div class="field">
        <label class="field-label" for="embedding-sentences">Sentences (one per line)</label>
        <textarea id="embedding-sentences" spellcheck="false">The cat sat on the mat.
A kitten rested on the rug.
The bat sat on the mat.
I love programming in Python.
Coding in Python is my passion.
Pythons are large snakes.
The stock market crashed today.
Share prices fell sharply.</textarea>
      </div>
      <div class="radio-options" role="group" aria-label="Embedding method">
        <label><input type="radio" name="embedding-method" value="spelling" checked> Spelling-based</label>
        <label><input type="radio" name="embedding-method" value="meaning"> Meaning-based</label>
      </div>
      <button id="embed-and-plot" type="button">Embed and plot</button>
      <p id="embedding-message" class="token-note" aria-live="polite"></p>
      <progress id="meaning-progress" max="100" value="0" hidden aria-label="Meaning model download progress"></progress>
      <div class="chart-controls" aria-label="Chart controls">
        <button id="toggle-labels" type="button" disabled>Hide sentence labels</button>
        <button id="reset-chart-view" type="button" disabled>Reset 3D view</button>
        <span class="chart-hint">Drag to rotate · scroll to zoom</span>
      </div>
      <div id="embedding-chart" class="chart-area" aria-label="Three-dimensional sentence embedding chart"></div>
      <div id="closest-pairs" class="closest-pairs" aria-live="polite"></div>

      <!-- // WHAT THIS DOES: Lets learners tokenize a new example and compare it with the plotted sentences. -->
      <div class="try-your-own">
        <label class="field-label" for="own-sentence">Try your own word or sentence</label>
        <textarea id="own-sentence" class="encode-box" placeholder="Type a word or sentence"></textarea>
        <button id="add-own-sentence" type="button">Tokenize, embed &amp; add to plot</button>
        <div id="own-token-results" class="token-results" aria-live="polite"></div>
        <div id="own-embedding-results" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script>
    // WHAT THIS DOES: Finds the training text, result area, and vocabulary button on the page.
    const trainingSentences = document.querySelector("#training-sentences");
    const vocabularyResults = document.querySelector("#vocabulary-results");
    const vocabularyControls = document.querySelector("#vocabulary-controls");
    const buildVocabularyButton = document.querySelector("#build-vocabulary");
    const encodeSentence = document.querySelector("#encode-sentence");
    const tokenizeButton = document.querySelector("#tokenize");
    const tokenResults = document.querySelector("#token-results");
    const embeddingSentences = document.querySelector("#embedding-sentences");
    const embedAndPlotButton = document.querySelector("#embed-and-plot");
    const embeddingMessage = document.querySelector("#embedding-message");
    const embeddingChart = document.querySelector("#embedding-chart");
    const toggleLabelsButton = document.querySelector("#toggle-labels");
    const resetChartViewButton = document.querySelector("#reset-chart-view");
    const meaningProgress = document.querySelector("#meaning-progress");
    const closestPairsArea = document.querySelector("#closest-pairs");
    const ownSentence = document.querySelector("#own-sentence");
    const addOwnSentenceButton = document.querySelector("#add-own-sentence");
    const ownTokenResults = document.querySelector("#own-token-results");
    const ownEmbeddingResults = document.querySelector("#own-embedding-results");
    let meaningPipelinePromise = null;
    let currentVocabulary = null;
    let wordsToKeep = 0;
    let hasBuiltVocabulary = false;
    let hasTokenizedSentence = false;
    let sentenceLabelsVisible = true;

    // WHAT THIS DOES: Turns punctuation into separate tokens and counts each token.
    function buildVocabulary(text) {
      const separatedPunctuation = text.toLowerCase().replace(/[.,!?']/g, " $& ");
      const words = separatedPunctuation.split(" ").filter(word => word.length > 0);
      const counts = new Map();

      for (const word of words) {
        counts.set(word, (counts.get(word) || 0) + 1);
      }

      const sortedWords = [...counts.entries()].sort((first, second) => {
        return second[1] - first[1] || first[0].localeCompare(second[0]);
      });

      return [
        { token: "[UNK]", count: 0 },
        ...sortedWords.map(([token, count]) => ({ token, count }))
      ];
    }

    // WHAT THIS DOES: Shows the vocabulary slider and table for the currently kept words.
    function showVocabulary(vocabulary) {
      const wordTokens = vocabulary.filter(item => item.token !== "[UNK]" && !/^[.,!?']$/.test(item.token));
      const punctuationTokens = vocabulary.filter(item => /^[.,!?']$/.test(item.token));
      const keptWords = wordTokens.slice(0, wordsToKeep);
      const visibleVocabulary = [vocabulary[0], ...keptWords, ...punctuationTokens];
      const rows = visibleVocabulary.map((item, id) => `
        <tr>
          <td>${id}</td>
          <td>${escapeHtml(item.token)}</td>
          <td>${item.count}</td>
        </tr>
      `).join("");

      if (!vocabularyControls.querySelector("input")) {
        vocabularyControls.hidden = false;
        vocabularyControls.innerHTML = `
          <label for="words-kept">Words kept: <span id="words-kept-count"></span> of ${wordTokens.length}</label>
          <input id="words-kept" type="range" min="0" max="${wordTokens.length}" value="${wordsToKeep}">
        `;
        vocabularyControls.querySelector("#words-kept").addEventListener("input", event => {
          wordsToKeep = Number(event.target.value);
          document.querySelector("#words-kept-count").textContent = wordsToKeep;
          showVocabulary(currentVocabulary);
          if (hasTokenizedSentence) {
            showTokens(encodeSentence.value, tokenizeSentence(encodeSentence.value, getKeptVocabulary()));
          }
        });
      }
      vocabularyControls.querySelector("#words-kept").max = wordTokens.length;
      vocabularyControls.querySelector("#words-kept").value = wordsToKeep;
      vocabularyControls.querySelector("#words-kept-count").textContent = wordsToKeep;

      vocabularyResults.innerHTML = `
        <p class="vocabulary-size">Vocabulary size: ${visibleVocabulary.length}</p>
        <div class="table-scroll">
          <table>
            <thead><tr><th>ID</th><th>token</th><th>count</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    // WHAT THIS DOES: Returns [UNK] and the top words currently allowed by the slider.
    function getKeptVocabulary() {
      const wordTokens = currentVocabulary.filter(item => item.token !== "[UNK]" && !/^[.,!?']$/.test(item.token));
      const punctuationTokens = currentVocabulary.filter(item => /^[.,!?']$/.test(item.token));
      return [currentVocabulary[0], ...wordTokens.slice(0, wordsToKeep), ...punctuationTokens];
    }

    // WHAT THIS DOES: Builds and displays the vocabulary when you click its button.
    buildVocabularyButton.addEventListener("click", () => {
      const fullVocabulary = buildVocabulary(trainingSentences.value);
      vocabularyControls.innerHTML = "";
      wordsToKeep = fullVocabulary.filter(item => item.token !== "[UNK]" && !/^[.,!?']$/.test(item.token)).length;
      currentVocabulary = fullVocabulary;
      hasBuiltVocabulary = true;
      showVocabulary(currentVocabulary);
      if (hasTokenizedSentence) {
        showTokens(encodeSentence.value, tokenizeSentence(encodeSentence.value, getKeptVocabulary()));
      }
    });

    // WHAT THIS DOES: Makes an unknown word from its first letter and marked remaining letters.
    function splitUnknownWord(word) {
      return [...word].map((letter, index) => index === 0 ? letter : `##${letter}`);
    }

    // WHAT THIS DOES: Gives every token ID a repeatable color.
    function colorForId(id) {
      const hue = 270 + (id * 31) % 75;
      return `hsl(${hue} 72% 90%)`;
    }

    // WHAT THIS DOES: Turns the sentence into vocabulary tokens or letter pieces for unknown words.
    function tokenizeSentence(sentence, vocabulary) {
      const separatedPunctuation = sentence.toLowerCase().replace(/[.,!?']/g, " $& ");
      const words = separatedPunctuation.split(" ").filter(word => word.length > 0);
      const tokenIds = new Map(vocabulary.map((item, id) => [item.token, id]));
      const pieces = [];

      for (const word of words) {
        if (tokenIds.has(word)) {
          pieces.push({ token: word, id: tokenIds.get(word) });
        } else {
          for (const piece of splitUnknownWord(word)) {
            pieces.push({ token: piece, id: tokenIds.has(piece) ? tokenIds.get(piece) : 0 });
          }
        }
      }

      return pieces;
    }

    // WHAT THIS DOES: Shows the token chips and the requested character and token counts.
    function showTokens(sentence, pieces, outputArea = tokenResults) {
      const characterCount = [...sentence].length;
      const tokenCount = pieces.length;
      const charactersPerToken = tokenCount === 0 ? "—" : (characterCount / tokenCount).toFixed(2);
      const chips = pieces.map(({ token, id }) => {
        const chipColor = colorForId(id);
        return `
          <div class="token-chip" style="--chip-color: ${chipColor}; --chip-border: ${chipColor.replace("90%", "70%")}">
            <span class="token-word">${escapeHtml(token)}</span>
            <span class="token-id">ID ${id}</span>
          </div>
        `;
      }).join("");

      outputArea.innerHTML = `
        <p class="token-note">unknown words are broken into smaller pieces</p>
        <div class="token-stats">
          <span>Characters: ${characterCount}</span>
          <span>Tokens: ${tokenCount}</span>
          <span>Characters per token: ${charactersPerToken}</span>
        </div>
        <div class="token-chips">${chips}</div>
      `;
    }

    // WHAT THIS DOES: Keeps text entered by the learner as text when showing it on the page.
    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[character]);
    }

    // WHAT THIS DOES: Hashes every overlapping group of three lowercase characters into 64 counts.
    function makeTrigramVector(sentence) {
      const text = sentence.toLowerCase();
      const vector = Array(64).fill(0);

      for (let index = 0; index <= text.length - 3; index += 1) {
        const trigram = text.slice(index, index + 3);
        let hash = 0;
        for (const character of trigram) {
          hash = (hash * 31 + character.charCodeAt(0)) % 64;
        }
        vector[hash] += 1;
      }

      const length = Math.sqrt(vector.reduce((sum, value) => sum + value * value, 0));
      if (length > 0) {
        return vector.map(value => value / length);
      }
      return vector;
    }

    // WHAT THIS DOES: Adds three equal-sized groups of values to make x, y, and z coordinates.
    function reduceVectorToThree(vector) {
      const firstCut = Math.floor(vector.length / 3);
      const secondCut = Math.floor(vector.length * 2 / 3);
      const x = vector.slice(0, firstCut).reduce((sum, value) => sum + value, 0);
      const y = vector.slice(firstCut, secondCut).reduce((sum, value) => sum + value, 0);
      const z = vector.slice(secondCut).reduce((sum, value) => sum + value, 0);
      return { x, y, z };
    }

    // WHAT THIS DOES: Finds the five sentence pairs with the highest cosine similarity.
    function findClosestPairs(sentences, vectors, targetIndex = null, limit = 5) {
      const pairs = [];
      for (let first = 0; first < vectors.length; first += 1) {
        for (let second = first + 1; second < vectors.length; second += 1) {
          if (targetIndex !== null && first !== targetIndex && second !== targetIndex) continue;
          let dotProduct = 0;
          let firstLength = 0;
          let secondLength = 0;
          for (let index = 0; index < vectors[first].length; index += 1) {
            dotProduct += vectors[first][index] * vectors[second][index];
            firstLength += vectors[first][index] * vectors[first][index];
            secondLength += vectors[second][index] * vectors[second][index];
          }
          const denominator = Math.sqrt(firstLength) * Math.sqrt(secondLength);
          const similarity = denominator === 0 ? 0 : dotProduct / denominator;
          pairs.push({ first, second, similarity });
        }
      }
      return pairs.sort((a, b) => b.similarity - a.similarity).slice(0, limit);
    }

    // WHAT THIS DOES: Shows the five closest sentence pairs and their similarity scores.
    function showClosestPairs(sentences, vectors) {
      const pairs = findClosestPairs(sentences, vectors);
      const rows = pairs.map(pair => `
        <tr>
          <td>Sentence ${pair.first + 1}: ${escapeHtml(sentences[pair.first])}<br>Sentence ${pair.second + 1}: ${escapeHtml(sentences[pair.second])}</td>
          <td>${pair.similarity.toFixed(3)}</td>
        </tr>
      `).join("");
      closestPairsArea.innerHTML = `
        <h3>Closest pairs</h3>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Sentence pair</th><th>Cosine similarity</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    // WHAT THIS DOES: Draws one labeled 3D point per sentence and shows its full text on hover.
    function drawEmbeddingChart(sentences, vectors, highlightedIndex = -1) {
      const coordinates = vectors.map(vector => reduceVectorToThree(vector));
      const labels = sentences.map((sentence, index) => `Sentence ${index + 1}`);
      const trace = {
        type: "scatter3d",
        mode: sentenceLabelsVisible ? "markers+text" : "markers",
        x: coordinates.map(point => point.x),
        y: coordinates.map(point => point.y),
        z: coordinates.map(point => point.z),
        text: labels,
        textposition: "top center",
        customdata: sentences,
        hovertemplate: "%{customdata}<extra></extra>",
        marker: {
          size: sentences.map((sentence, index) => index === highlightedIndex ? 12 : 6),
          color: sentences.map((sentence, index) => index === highlightedIndex ? "#f28c28" : "#75438a"),
          opacity: 0.9
        }
      };
      const layout = {
        margin: { l: 0, r: 0, t: 20, b: 0 },
        scene: {
          xaxis: { title: "x" },
          yaxis: { title: "y" },
          zaxis: { title: "z" },
          camera: { eye: { x: 1.25, y: 1.25, z: 1.25 } }
        },
        paper_bgcolor: "#fdfafe",
        font: { family: "system-ui, sans-serif", color: "#30213a" },
        autosize: true
      };

      Plotly.newPlot(embeddingChart, [trace], layout, { responsive: true });
      toggleLabelsButton.disabled = false;
      resetChartViewButton.disabled = false;
      showClosestPairs(sentences, vectors);
    }

    // WHAT THIS DOES: Shows or hides the sentence names beside chart points.
    toggleLabelsButton.addEventListener("click", () => {
      sentenceLabelsVisible = !sentenceLabelsVisible;
      Plotly.restyle(embeddingChart, { mode: sentenceLabelsVisible ? "markers+text" : "markers" });
      toggleLabelsButton.textContent = sentenceLabelsVisible ? "Hide sentence labels" : "Show sentence labels";
    });

    // WHAT THIS DOES: Returns the chart camera to its original 3D view.
    resetChartViewButton.addEventListener("click", () => {
      Plotly.relayout(embeddingChart, { "scene.camera": { eye: { x: 1.25, y: 1.25, z: 1.25 } } });
    });

    // WHAT THIS DOES: Loads the sentence model once and displays its download progress.
    async function loadMeaningPipeline() {
      if (meaningPipelinePromise === null) {
        meaningPipelinePromise = import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2")
          .then(({ pipeline }) => pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2", {
            progress_callback: info => {
              if (info.status === "progress_total" && Number.isFinite(info.progress)) {
                meaningProgress.hidden = false;
                meaningProgress.value = info.progress;
                embeddingMessage.textContent = `Downloading meaning model: ${info.progress.toFixed(0)}%`;
              } else if (info.status === "initiate") {
                meaningProgress.hidden = false;
                meaningProgress.value = 0;
                embeddingMessage.textContent = `Preparing ${info.file || "meaning model"}...`;
              }
            }
          }));
      }
      return meaningPipelinePromise;
    }

    // WHAT THIS DOES: Uses the meaning model or falls back to spelling numbers if it fails.
    async function makeMeaningVectors(sentences) {
      const extractor = await loadMeaningPipeline();
      const result = await extractor(sentences, { pooling: "mean", normalize: true });
      return result.tolist();
    }

    // WHAT THIS DOES: Makes vectors with the selected method, using spelling numbers if meaning mode fails.
    async function makeSelectedVectors(sentences, selectedMethod) {
      if (selectedMethod === "meaning") {
        return await makeMeaningVectors(sentences);
      }
      return sentences.map(sentence => makeTrigramVector(sentence));
    }

    // WHAT THIS DOES: Checks the sentence list and draws the selected type of embeddings.
    embedAndPlotButton.addEventListener("click", async () => {
      const sentences = embeddingSentences.value.split("\n").map(line => line.trim()).filter(Boolean);
      const selectedMethod = document.querySelector('input[name="embedding-method"]:checked').value;

      if (!hasBuiltVocabulary) {
        embeddingMessage.textContent = "Please click Build vocabulary first.";
        return;
      }
      if (!hasTokenizedSentence) {
        embeddingMessage.textContent = "Please click Tokenize first.";
        return;
      }

      if (sentences.length < 4) {
        if (typeof Plotly !== "undefined") Plotly.purge(embeddingChart);
        closestPairsArea.innerHTML = "";
        meaningProgress.hidden = true;
        embeddingMessage.textContent = "Please enter at least 4 sentences, one per line.";
        return;
      }

      if (typeof Plotly === "undefined") {
        embeddingMessage.textContent = "The chart library could not load. Check your internet connection and reload the page.";
        return;
      }

      if (selectedMethod === "meaning") {
        embedAndPlotButton.disabled = true;
        meaningProgress.hidden = false;
        meaningProgress.value = 0;
        embeddingMessage.textContent = "Loading meaning model...";
        try {
          const vectors = await makeSelectedVectors(sentences, selectedMethod);
          meaningProgress.hidden = true;
          embeddingMessage.textContent = "Meaning-based embeddings";
          drawEmbeddingChart(sentences, vectors);
        } catch (error) {
          meaningPipelinePromise = null;
          meaningProgress.hidden = true;
          embeddingMessage.textContent = "Meaning mode needs the page served over http - using spelling-based instead";
          const spellingVectors = sentences.map(sentence => makeTrigramVector(sentence));
          drawEmbeddingChart(sentences, spellingVectors);
        } finally {
          embedAndPlotButton.disabled = false;
        }
        return;
      }

      meaningProgress.hidden = true;
      embeddingMessage.textContent = "Spelling-based embeddings";
      const spellingVectors = sentences.map(sentence => makeTrigramVector(sentence));
      drawEmbeddingChart(sentences, spellingVectors);
    });

    // WHAT THIS DOES: Tokenizes a new example, adds it to the list, and highlights it in the chart.
    addOwnSentenceButton.addEventListener("click", async () => {
      if (!hasBuiltVocabulary || !hasTokenizedSentence || currentVocabulary === null) {
        ownEmbeddingResults.textContent = "Please click Build vocabulary and then Tokenize in Part 1 first.";
        return;
      }
      if (typeof Plotly === "undefined") {
        ownEmbeddingResults.textContent = "The chart library could not load. Check your internet connection and reload the page.";
        return;
      }

      const newSentence = ownSentence.value.trim().replace(/\s+/g, " ");
      if (!newSentence) {
        ownEmbeddingResults.textContent = "Please enter a word or sentence first.";
        return;
      }

      showTokens(newSentence, tokenizeSentence(newSentence, getKeptVocabulary()), ownTokenResults);
      const sentences = embeddingSentences.value.split("\n").map(line => line.trim()).filter(Boolean);
      sentences.push(newSentence);
      embeddingSentences.value = sentences.join("\n");
      const newIndex = sentences.length - 1;
      const selectedMethod = document.querySelector('input[name="embedding-method"]:checked').value;
      addOwnSentenceButton.disabled = true;
      meaningProgress.hidden = selectedMethod !== "meaning";
      ownEmbeddingResults.textContent = selectedMethod === "meaning" ? "Preparing meaning embedding..." : "";
      try {
        let vectors;
        try {
          vectors = await makeSelectedVectors(sentences, selectedMethod);
          if (selectedMethod === "meaning") embeddingMessage.textContent = "Meaning-based embeddings";
        } catch (error) {
          meaningPipelinePromise = null;
          meaningProgress.hidden = true;
          embeddingMessage.textContent = "Meaning mode needs the page served over http - using spelling-based instead";
          vectors = sentences.map(sentence => makeTrigramVector(sentence));
        }

        const firstEight = vectors[newIndex].slice(0, 8).map(value => Number(value).toFixed(3));
        const nearest = findClosestPairs(sentences, vectors, newIndex, 3);
        const nearestRows = nearest.map(pair => {
          const otherIndex = pair.first === newIndex ? pair.second : pair.first;
          return `<li>${escapeHtml(sentences[otherIndex])} — ${pair.similarity.toFixed(3)}</li>`;
        }).join("");
        drawEmbeddingChart(sentences, vectors, newIndex);
        ownEmbeddingResults.innerHTML = `
          <p class="own-vector"><strong>First 8 vector numbers:</strong> ${firstEight.join(", ")}</p>
          <h3>3 closest sentences</h3>
          <ol>${nearestRows}</ol>
        `;
      } finally {
        meaningProgress.hidden = true;
        addOwnSentenceButton.disabled = false;
      }
    });

    // WHAT THIS DOES: Tokenizes the example sentence when you click Tokenize.
    tokenizeButton.addEventListener("click", () => {
      if (currentVocabulary === null) {
        tokenResults.innerHTML = "<p class=\"token-note\">Click Build vocabulary first.</p>";
        return;
      }

      const sentence = encodeSentence.value;
      hasTokenizedSentence = true;
      showTokens(sentence, tokenizeSentence(sentence, getKeptVocabulary()));
    });
  </script>
</body>
</html>
